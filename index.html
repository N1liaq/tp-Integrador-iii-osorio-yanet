<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Los Simpsons</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>
    <div class="fondoHeader">
      <header>
        <div class="row">
          <div class="col-sm-12 col-md-6 col-lg-4 m-auto mt-3">
            <form class="d-flex p-3" role="search">
              <input
                class="form-control me-2"
                type="search"
                placeholder="búsqueda de personajes"
                aria-label="Search"
                id="buscador"
              />

              <button
                class="btn btn-light ms-2 d-none"
                type="button"
                id="recargar"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="currentColor"
                  class="bi bi-arrow-counterclockwise"
                  viewBox="0 0 16 16"
                >
                  <path
                    fill-rule="evenodd"
                    d="M8 3a5 5 0 1 1-4.546 2.914.5.5 0 0 0-.908-.417A6 6 0 1 0 8 2z"
                  />
                  <path
                    d="M8 4.466V.534a.25.25 0 0 0-.41-.192L5.23 2.308a.25.25 0 0 0 0 .384l2.36 1.966A.25.25 0 0 0 8 4.466"
                  />
                </svg>
              </button>
            </form>
          </div>
        </div>
        <h1 class="text-center p-5">Los Simpsons</h1>
      </header>
    </div>
    <div class="container-fluid fondoDePagina">
      <main>
        <div class="container">
          <div class="row" id="rowContainer"></div>

          <div
            class="modal fade"
            id="modal"
            tabindex="-1"
            aria-labelledby="exampleModalLabel"
            aria-hidden="true"
          >
            <div class="modal-dialog modal-lg modal-dialog-centered">
              <div class="modal-content position-relative">
                <div class="modal-header">
                  <h1 class="modal-title fs-5" id="exampleModalLabel"></h1>
                  <button
                    type="button"
                    class="btn-close boton-cerrar-custom"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                  ></button>
                  <div class="modal-body">
                    <div class="row align-items-center">
                      <div
                        class="col-md-5 text-center mb-3 mb-md-0"
                        id="ladoIzq"
                      >
                        <div id="mImagen"></div>
                      </div>
                      <div class="col-md-7" id="ladoDer">
                        <ul class="list-group list-group-flush">
                          <li class="list-group-item">
                            <strong>Nombre:</strong> <span id="mNombre"></span>
                          </li>
                          <li class="list-group-item">
                            <strong>Edad:</strong> <span id="mEdad"></span>
                          </li>
                          <li class="list-group-item">
                            <strong>Fecha de nacimiento:</strong>
                            <span id="mNacim"></span>
                          </li>
                          <li class="list-group-item">
                            <strong>Género:</strong> <span id="mGenero"></span>
                          </li>
                          <li class="list-group-item">
                            <strong>Ocupación:</strong>
                            <span id="mOcupacion"></span>
                          </li>
                          <li class="list-group-item">
                            <strong>Estado:</strong> <span id="mEstado"></span>
                          </li>
                          <li class="list-group-item">
                            <strong>Frase:</strong>
                            <span
                              id="mFrase"
                              class="fst-italic text-muted"
                            ></span>
                          </li>
                        </ul>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="modal-body">
                  <form>
                    <div class="contenidoModal mb-3"></div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
